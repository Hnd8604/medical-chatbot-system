spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD}
  jpa:
    show-sql: false
  output:
    ansi:
      enabled: never

chatbot:
  service:
    base-url: ${CHATBOT_SERVICE_BASE_URL}

litellm:
  base-url: ${LITELLM_BASE_URL:http://litellm:4000}
  master-key: ${LITELLM_MASTER_KEY:}
  enabled: ${LITELLM_GATEWAY_ENABLED:false}

jwt:
  secret: ${JWT_SECRET}

backup:
  enabled: ${BACKUP_ENABLED:false}

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:false}
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:false}

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS}

logging:
  level:
    root: info
    com.medicalchatbot.backend: info
    org.hibernate.SQL: warn
    org.hibernate.orm.jdbc.bind: warn

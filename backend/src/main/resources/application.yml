spring:
  config:
    import: optional:file:.env[.properties]
  profiles:
    default: dev
  application:
    name: spring-backend
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  # JSON của REST API dùng camelCase (mặc định của Jackson). DTO gửi/nhận với chatbot-service
  # (Python) tự khai báo snake_case bằng @JsonNaming.
  data:
    redis:
      timeout: 2s
      # Redis chỉ dùng làm key-value store (refresh token, OTP, rate limit), không có Redis repository.
      repositories:
        enabled: false
  mail:
    host: ${SPRING_MAIL_HOST:}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  port: ${SERVER_PORT:8081}
  servlet:
    # Mọi endpoint (kể cả actuator, Swagger) nằm dưới /api/v1; controller chỉ khai báo phần sau đó.
    context-path: /api/v1
  shutdown: graceful
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        # health: công khai (liveness/readiness cho Docker/K8s); prometheus, info: chỉ ADMIN (SecurityConfig).
        include: health,info,prometheus
  health:
    mail:
      enabled: false
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        # Sẵn sàng nhận request khi cả PostgreSQL và Redis đều dùng được.
        readiness:
          include: readinessState,db,redis
  observations:
    key-values:
      application: ${spring.application.name}

logging:
  pattern:
    # Mỗi dòng log mang request id (RequestIdFilter) để lần theo một request.
    correlation: "[%X{requestId:-}] "

app:
  # Ngày của quota (request/token/cost), báo cáo chi phí và xuất lịch sử tính theo timezone này.
  timezone: ${APP_TIMEZONE:Asia/Ho_Chi_Minh}
  rate-limit:
    # Login, đăng ký, quên/đặt lại mật khẩu: số request mỗi phút trên mỗi endpoint, theo IP client.
    auth-requests-per-minute: ${APP_AUTH_RATE_LIMIT_PER_MINUTE:10}

chatbot:
  service:
    connect-timeout: ${CHATBOT_SERVICE_CONNECT_TIMEOUT:3s}
    read-timeout: ${CHATBOT_SERVICE_READ_TIMEOUT:120s}

password-reset:
  otp-ttl-minutes: ${PASSWORD_RESET_OTP_TTL_MINUTES:10}
  ticket-ttl-minutes: ${PASSWORD_RESET_TICKET_TTL_MINUTES:10}
  max-attempts: ${PASSWORD_RESET_MAX_ATTEMPTS:5}
  resend-cooldown-seconds: ${PASSWORD_RESET_RESEND_COOLDOWN_SECONDS:60}
  from-address: ${PASSWORD_RESET_FROM_ADDRESS:no-reply@medical-chatbot.local}
  from-name: ${PASSWORD_RESET_FROM_NAME:Medical Chatbot}

jwt:
  expiration-minutes: ${JWT_EXPIRATION_MINUTES:30}
  refresh-expiration-minutes: ${JWT_REFRESH_EXPIRATION_MINUTES:10080}

telegram:
  bot-token: ${TELEGRAM_BOT_TOKEN:}
  chat-id: ${TELEGRAM_CHAT_ID:}

backup:
  cron: ${BACKUP_CRON:0 0 2 * * *}
  timezone: ${BACKUP_TIMEZONE:Asia/Ho_Chi_Minh}
  script-path: ${BACKUP_SCRIPT_PATH:../infra/scripts/backup.sh}
  restore-script-path: ${BACKUP_RESTORE_SCRIPT_PATH:../infra/scripts/restore-auto.sh}
  bash-path: ${BACKUP_BASH_PATH:bash}
  timeout: ${BACKUP_TIMEOUT:10m}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    display-request-duration: true
    tags-sorter: alpha
    operations-sorter: alpha

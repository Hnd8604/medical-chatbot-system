<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0ea5e9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="crossGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e0f2fe;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0ea5e9" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Rounded background -->
  <rect width="192" height="192" rx="40" fill="url(#bgGrad)" filter="url(#shadow)" />

  <!-- Medical cross (horizontal + vertical bars) -->
  <rect x="72" y="36" width="48" height="120" rx="14" fill="url(#crossGrad)" />
  <rect x="36" y="72" width="120" height="48" rx="14" fill="url(#crossGrad)" />

  <!-- Center dot -->
  <circle cx="96" cy="96" r="16" fill="url(#bgGrad)" opacity="0.75"/>
</svg>

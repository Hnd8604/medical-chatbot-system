# App gửi tên alias (gpt-4o-mini / gpt-4.1-mini) → LiteLLM match với model_list trong config.yaml rồi forward tới OpenAI.
model_list:
  - model_name: gpt-4o-mini
    litellm_params:
      model: openai/gpt-4o-mini
      api_key: os.environ/OPENAI_API_KEY
  - model_name: gpt-4.1-mini
    litellm_params:
      model: openai/gpt-4.1-mini
      api_key: os.environ/OPENAI_API_KEY
  - model_name: groq-llama-8b
    litellm_params:
      model: groq/llama-3.1-8b-instant
      api_key: os.environ/GROQ_API_KEY
  - model_name: groq-llama-70b
    litellm_params:
      model: groq/llama-3.3-70b-versatile
      api_key: os.environ/GROQ_API_KEY

litellm_settings:
  request_timeout: 30
  drop_params: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  # DB-backed: bat virtual key + spend log + Admin UI. LiteLLM tu chay Prisma
  # migrate tao bang LiteLLM_* luc boot khi co database_url.
  database_url: os.environ/DATABASE_URL
  store_model_in_db: true

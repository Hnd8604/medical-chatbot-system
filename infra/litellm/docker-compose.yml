services:
  litellm:
    # Pin version: header x-litellm-response-cost va provider_budget_config phu thuoc
    # version. Nang version thi chay lai test tich hop gateway truoc.
    image: ghcr.io/berriai/litellm:v1.104.2
    container_name: medical-litellm
    # Chi bind localhost: gateway chi co mot master key, khong duoc public.
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      # Khong co DATABASE_URL: gateway chay khong trang thai (khong virtual key, khong
      # spend log, khong Admin UI). Them provider thi them key cua provider do o day.
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health/liveliness"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

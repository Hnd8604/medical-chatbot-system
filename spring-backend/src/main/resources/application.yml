spring:
  config:
    import: optional:file:.env[.properties]
  profiles:
    default: dev
  application:
    name: spring-backend
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  data:
    redis:
      timeout: 2s
  mail:
    host: ${SPRING_MAIL_HOST:}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  port: ${SERVER_PORT:8081}
  shutdown: graceful
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    mail:
      enabled: false
  endpoint:
    health:
      show-details: never

chatbot:
  service:
    connect-timeout: ${CHATBOT_SERVICE_CONNECT_TIMEOUT:3s}
    read-timeout: ${CHATBOT_SERVICE_READ_TIMEOUT:120s}

password-reset:
  otp-ttl-minutes: ${PASSWORD_RESET_OTP_TTL_MINUTES:10}
  ticket-ttl-minutes: ${PASSWORD_RESET_TICKET_TTL_MINUTES:10}
  max-attempts: ${PASSWORD_RESET_MAX_ATTEMPTS:5}
  resend-cooldown-seconds: ${PASSWORD_RESET_RESEND_COOLDOWN_SECONDS:60}
  from-address: ${PASSWORD_RESET_FROM_ADDRESS:no-reply@medical-chatbot.local}
  from-name: ${PASSWORD_RESET_FROM_NAME:Medical Chatbot}

jwt:
  expiration-minutes: ${JWT_EXPIRATION_MINUTES:30}
  refresh-expiration-minutes: ${JWT_REFRESH_EXPIRATION_MINUTES:10080}

telegram:
  bot:
    token: ${TELEGRAM_BOT_TOKEN:}
  chat:
    id: ${TELEGRAM_CHAT_ID:}

backup:
  cron: ${BACKUP_CRON:0 0 2 * * *}
  timezone: ${BACKUP_TIMEZONE:Asia/Ho_Chi_Minh}
  script-path: ${BACKUP_SCRIPT_PATH:../infra/scripts/backup.sh}
  restore-script-path: ${BACKUP_RESTORE_SCRIPT_PATH:../infra/scripts/restore-auto.sh}
  bash-path: ${BACKUP_BASH_PATH:bash}
  timeout-minutes: ${BACKUP_TIMEOUT_MINUTES:10}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    display-request-duration: true
    tags-sorter: alpha
    operations-sorter: alpha

spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: spring-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/medical_chatbot_app}
    username: ${SPRING_DATASOURCE_USERNAME:app_user}
    password: ${SPRING_DATASOURCE_PASSWORD:app_password}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto:
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      timeout: 2000

server:
  port: ${SERVER_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info

chatbot:
  service:
    base-url: ${CHATBOT_SERVICE_BASE_URL:http://localhost:8000}

jwt:
  secret: ${JWT_SECRET:dev-only-jwt-secret-change-me-please-1234567890}
  expiration-minutes: ${JWT_EXPIRATION_MINUTES:480}

telegram:
  bot:
    token: ${TELEGRAM_BOT_TOKEN:}
  chat:
    id: ${TELEGRAM_CHAT_ID:}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html # truy cập: http://localhost:8081/swagger-ui/index.html
    display-request-duration: true
    tags-sorter: alpha
    operations-sorter: alpha

spring:
  application:
    name: spring-backend
  datasource:
    url: jdbc:postgresql://localhost:5433/medical_chatbot_app
    username: app_user
    password: app_password
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto:
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info

chatbot:
  service:
    base-url: http://localhost:8000
